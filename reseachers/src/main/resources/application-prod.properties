# ================================================================
#  SLARI Research Hub ? Production Properties
#  These values are set as environment variables on Railway
#  Never hardcode real credentials here
# ================================================================

# Database ? Railway injects DATABASE_URL automatically
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA ? validate only in production, never auto-create
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# File uploads ? use /tmp in production (Railway ephemeral disk)
# Replace with Cloudinary in a future iteration
file.upload-dir=/tmp/slari-uploads

# Multipart
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Hide errors from API responses in production
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Logging ? minimal in production
logging.level.root=WARN
logging.level.slari.researchers=INFO

# Swagger ? disable in production for security
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false