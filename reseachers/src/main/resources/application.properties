# ================================================================
#  SLARI Research Hub - Application Properties
# ================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=slari-research-hub

# ================================================================
# DATABASE CONFIGURATION - PostgreSQL
# ================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/slari_research_hub
spring.datasource.username=postgres
spring.datasource.password=Mbb@999
spring.datasource.driver-class-name=org.postgresql.Driver

# ================================================================
# JPA / HIBERNATE
# ================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ================================================================
# JWT - MUST BE AT LEAST 32 BYTES!
# ================================================================
jwt.secret=slari-research-hub-super-secret-key-2024-more-chars
jwt.expiration=86400000

# ================================================================
# JACKSON
# ================================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ================================================================
# LOGGING
# ================================================================
logging.level.slari.researchers=INFO
logging.level.org.springframework.security=DEBUG
logging.level.root=WARN

# ================================================================
# MULTIPART FILE UPLOAD
# ================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ================================================================
# SWAGGER / OPENAPI
# ================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ================================================================
# FILE UPLOAD DIRECTORY
# ================================================================
file.upload-dir=./uploads

# ================================================================
# PROFILE (disabled)
# ================================================================
# spring.profiles.active=dev