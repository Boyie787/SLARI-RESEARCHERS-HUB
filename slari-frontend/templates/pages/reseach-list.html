<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Varieties — SLARI Research Hub</title>
  <link rel="stylesheet" href="../../static/css/main.css">
  <link rel="stylesheet" href="../../static/css/layout.css">
  <link rel="stylesheet" href="../../static/css/component.css">
</head>
<body>

<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar__logo">
      <div class="sidebar__brand">🌱 SLARI</div>
      <div class="sidebar__tagline">Agricultural Research Platform</div>
    </div>
    <div class="sidebar__nav"  id="sidebar-nav"></div>
    <div class="sidebar__user" id="sidebar-user"></div>
  </nav>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- ===== MAIN ===== -->
  <main class="main">

    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar__left">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <span class="topbar__title" id="page-title">Browse Varieties</span>
      </div>
      <div class="topbar__actions" id="topbar-actions">
        <!-- Filled by JS based on active tab -->
      </div>
    </div>

    <!-- Page tabs -->
    <div style="background:var(--white);border-bottom:2px solid var(--border-2);padding:0 28px;display:flex;gap:2px;" id="page-tabs">
      <button class="tab-btn" id="tab-browse"    onclick="switchView('browse')">🔍 Browse All</button>
      <button class="tab-btn" id="tab-bookmarks" onclick="switchView('bookmarks')">🔖 My Bookmarks</button>
      <button class="tab-btn" id="tab-insights"  onclick="switchView('insights')">📊 Crop Insights</button>
    </div>

    <!-- Content area -->
    <div id="view-content" class="page">
      <!-- Filled by JS -->
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div><span style="color:rgba(255,255,255,.8);font-weight:600;">🌱 SLARI</span> — Sierra Leone Agricultural Research Institute</div>
      <div style="display:flex;gap:20px;">
        <a href="index.html"        style="color:rgba(255,255,255,.45);">Home</a>
        <a href="reseach-list.html" style="color:rgba(255,255,255,.45);">Varieties</a>
        <a href="login.html"        style="color:rgba(255,255,255,.45);">Login</a>
      </div>
      <div>&copy; <span id="footer-year"></span> SLARI.</div>
    </footer>

  </main>
</div>

<!-- Modal & Toast -->
<div class="modal-overlay" id="modal-overlay" style="display:none"
     onclick="if(event.target===this)Modal.close()"></div>
<div class="toast" id="toast" style="display:none"></div>

<!-- Scripts -->
<script src="../../static/js/api.js"></script>
<script src="../../static/js/app.js"></script>
<script src="../../static/js/ui.js"></script>
<script src="../../static/js/modal.js"></script>

<script>
/* ============================================================
   reseach-list.js — inline page logic
   ============================================================ */

document.getElementById('footer-year').textContent = new Date().getFullYear();
initPage({ title: 'Browse Varieties' });

/* ── Filter state ── */
const fs = {
  query: '', cropType: '', region: '', season: '',
  hasActive() { return !!(this.query || this.cropType || this.region || this.season); },
  clear()     { this.query = this.cropType = this.region = this.season = ''; },
};

/* ── Read initial view from URL param (e.g. ?view=bookmarks) ── */
let activeView = getParam('view') || 'browse';

/* ── Switch between browse / bookmarks / insights ── */
function switchView(view) {
  activeView = view;

  /* Update tab styles */
  ['browse','bookmarks','insights'].forEach(v => {
    document.getElementById('tab-' + v).classList.toggle('active', v === view);
  });

  /* Update page title */
  const titles = { browse:'Browse Varieties', bookmarks:'My Bookmarks', insights:'Crop Insights' };
  document.getElementById('page-title').textContent = titles[view];

  /* Render the right view */
  if (view === 'browse')    renderBrowse();
  if (view === 'bookmarks') renderBookmarks();
  if (view === 'insights')  renderInsights();
}

/* ===================
   BROWSE VIEW
   =================== */
function renderBrowse() {
  const user = Auth.getUser();
  const showAll = user && (user.role === 'admin' || user.role === 'researcher');
  let list = showAll ? getAllVarieties() : getPublishedVarieties();
  list = fs.cropType ? list.filter(v => v.crop === fs.cropType) : list;
  list = fs.region   ? list.filter(v => v.region === fs.region || v.region === 'All Zones') : list;
  list = fs.season   ? list.filter(v => v.season === fs.season || v.season === 'Bimodal') : list;
  if (fs.query) {
    const q = fs.query.toLowerCase();
    list = list.filter(v =>
      v.name.toLowerCase().includes(q) ||
      v.crop.toLowerCase().includes(q) ||
      (v.description || '').toLowerCase().includes(q)
    );
  }

  document.getElementById('topbar-actions').innerHTML =
    (user && user.role === 'researcher')
      ? `<a href="dashboard.html?view=upload" class="btn btn--primary btn--sm">➕ Upload Variety</a>`
      : '';

  document.getElementById('view-content').innerHTML = `
    <!-- Search -->
    <div class="search-bar">
      <input class="search-input" type="text"
             placeholder="🔍 Search by name, crop type, or keyword…"
             value="${escapeHtml(fs.query)}"
             oninput="onSearch(this.value)">
    </div>

    <!-- Filters -->
    <div class="filter-row">
      <span class="filter-label">Filter:</span>

      <select class="filter-select" onchange="onFilter('cropType', this.value)">
        <option value="">All Crops</option>
        ${CROP_TYPES.filter(c => c !== 'All Crops').map(c =>
          `<option value="${c}" ${fs.cropType === c ? 'selected' : ''}>${c}</option>`
        ).join('')}
      </select>

      <select class="filter-select" onchange="onFilter('region', this.value)">
        <option value="">All Regions</option>
        ${REGIONS.filter(r => r !== 'All Regions').map(r =>
          `<option value="${r}" ${fs.region === r ? 'selected' : ''}>${r}</option>`
        ).join('')}
      </select>

      <select class="filter-select" onchange="onFilter('season', this.value)">
        <option value="">All Seasons</option>
        ${SEASONS.filter(s => s !== 'All Seasons').map(s =>
          `<option value="${s}" ${fs.season === s ? 'selected' : ''}>${s}</option>`
        ).join('')}
      </select>

      ${fs.hasActive() ? `
        <button class="btn btn--ghost btn--sm" onclick="clearFilters()">✕ Clear</button>
      ` : ''}
    </div>

    <p class="results-count">${list.length} variet${list.length === 1 ? 'y' : 'ies'} found</p>

    ${list.length === 0 ? `
      <div class="empty-state">
        <div class="empty-state__icon">🌱</div>
        <h3 class="empty-state__title">No varieties found</h3>
        <p class="empty-state__desc">Try adjusting your search or filter criteria.</p>
        ${fs.hasActive() ? `<div style="margin-top:16px;"><button class="btn btn--secondary" onclick="clearFilters()">Clear Filters</button></div>` : ''}
      </div>
    ` : `
      <div class="card-grid">${list.map(v => varietyCardHTML(v)).join('')}</div>
    `}
  `;
}

/* ===================
   BOOKMARKS VIEW
   =================== */
function renderBookmarks() {
  const user = Auth.getUser();

  document.getElementById('topbar-actions').innerHTML = '';

  if (!user || user.role === 'guest') {
    document.getElementById('view-content').innerHTML = `
      <div class="empty-state">
        <div class="empty-state__icon">🔐</div>
        <h3 class="empty-state__title">Sign in to use bookmarks</h3>
        <p class="empty-state__desc">Create a free account to save and track varieties.</p>
        <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;">
          <a href="login.html"    class="btn btn--primary">Sign In</a>
          <a href="register.html" class="btn btn--secondary">Create Account</a>
        </div>
      </div>
    `;
    return;
  }

  const saved = getAllVarieties().filter(v => Bookmarks.has(v.id));

  document.getElementById('view-content').innerHTML = saved.length === 0 ? `
    <div class="empty-state">
      <div class="empty-state__icon">🔖</div>
      <h3 class="empty-state__title">No bookmarks yet</h3>
      <p class="empty-state__desc">Browse varieties and tap 🔲 to save them here for quick reference.</p>
      <div style="margin-top:18px;">
        <button class="btn btn--primary" onclick="switchView('browse')">Browse Varieties</button>
      </div>
    </div>
  ` : `
    <p class="results-count">${saved.length} saved variet${saved.length === 1 ? 'y' : 'ies'}</p>
    <div class="card-grid">${saved.map(v => varietyCardHTML(v)).join('')}</div>
  `;
}

/* ===================
   INSIGHTS VIEW
   =================== */
function renderInsights() {
  document.getElementById('topbar-actions').innerHTML = '';

  const published = getPublishedVarieties();
  const stats = getPlatformStats();

  /* Count varieties per crop */
  const byCrop = {};
  published.forEach(v => { byCrop[v.crop] = (byCrop[v.crop] || 0) + 1; });

  /* Top 5 by rating */
  const topRated = [...published].sort((a, b) => b.rating - a.rating).slice(0, 5);

  document.getElementById('view-content').innerHTML = `

    <!-- Platform summary stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-card__label">Published Varieties</div>
        <div class="stat-card__value">${stats.published}</div>
        <div class="stat-card__sub">Ready for adoption</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">Crop Types Covered</div>
        <div class="stat-card__value">${Object.keys(byCrop).length}</div>
        <div class="stat-card__sub">Different species</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">Regions Covered</div>
        <div class="stat-card__value">4</div>
        <div class="stat-card__sub">N · S · E · Western</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">Research Stations</div>
        <div class="stat-card__value">5</div>
        <div class="stat-card__sub">Across Sierra Leone</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;flex-wrap:wrap;">

      <!-- Varieties by crop bar chart -->
      <div class="card">
        <div class="card__title">Varieties by Crop Type</div>
        ${Object.entries(byCrop)
          .sort((a, b) => b[1] - a[1])
          .map(([crop, count]) => `
            <div style="margin-bottom:14px;">
              <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;">
                <span style="font-weight:600;">${crop}</span>
                <span style="color:var(--text-3);">${count} variet${count > 1 ? 'ies' : 'y'}</span>
              </div>
              <div class="progress-bar">
                <div class="progress-bar__fill"
                     style="width:${Math.round(count / published.length * 100)}%"></div>
              </div>
            </div>
          `).join('')}
      </div>

      <!-- Top rated table -->
      <div class="card card--flush">
        <div style="padding:16px 18px 0;font-family:Georgia,serif;font-size:17px;
                    color:var(--green-800);border-bottom:1px solid var(--border-2);
                    padding-bottom:12px;margin-bottom:0;">
          Top Rated Varieties
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th>Variety</th>
              <th>Crop</th>
              <th>Yield</th>
              <th>Rating</th>
            </tr>
          </thead>
          <tbody>
            ${topRated.map(v => `
              <tr onclick="openVarietyModal(${v.id})" style="cursor:pointer;">
                <td><strong>${v.name}</strong></td>
                <td>${v.crop}</td>
                <td>${v.yield} ${v.yieldUnit}</td>
                <td>⭐ ${v.rating} <span style="color:var(--text-3);font-size:11px;">(${v.ratingCount})</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <!-- Region coverage -->
    <div class="card" style="margin-top:20px;">
      <div class="card__title">Regional Coverage</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;">
        ${['Northern','Southern','Eastern','Western Area'].map(region => {
          const regionCount = published.filter(v => v.region === region || v.region === 'All Zones').length;
          return `
            <div style="text-align:center;padding:18px 12px;background:var(--green-50);
                        border-radius:var(--radius);border:1px solid var(--green-100);">
              <div style="font-size:24px;margin-bottom:6px;">
                ${{ Northern:'☀️', Southern:'🌧️', Eastern:'🏔️', 'Western Area':'🏙️' }[region]}
              </div>
              <div style="font-size:20px;font-weight:700;color:var(--green-700);font-family:Georgia,serif;">
                ${regionCount}
              </div>
              <div style="font-size:12px;color:var(--text-3);margin-top:3px;">${region}</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

/* ===================
   FILTER HANDLERS
   =================== */
let _searchDebounce;
function onSearch(val) {
  fs.query = val;
  clearTimeout(_searchDebounce);
  _searchDebounce = setTimeout(() => renderBrowse(), 220);
}
function onFilter(key, val) {
  fs[key] = val;
  renderBrowse();
}
function clearFilters() {
  fs.clear();
  renderBrowse();
}

/* ===================
   UTILITY
   =================== */
function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])
  );
}

/* ===================
   INIT
   =================== */
switchView(activeView);
</script>

</body>
</html>
