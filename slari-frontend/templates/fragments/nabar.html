<!-- ============================================================
     SLARI — RESEARCH HUB
     fragments/nabar.html
     Sidebar / navigation fragment.
     This structure is injected into every page via ui.js renderSidebar().
     The #sidebar-nav and #sidebar-user divs are populated dynamically
     based on the logged-in user's role from localStorage.
     ============================================================ -->

<nav class="sidebar" id="sidebar">
  <!-- Brand logo -->
  <div class="sidebar__logo">
    <div class="sidebar__brand">🌱 SLARI</div>
    <div class="sidebar__tagline">Agricultural Research Platform</div>
  </div>

  <!-- Nav links — filled by ui.js renderSidebar() -->
  <div class="sidebar__nav" id="sidebar-nav">
    <!-- Dynamic nav items injected here -->
  </div>

  <!-- User chip + logout — filled by ui.js renderSidebar() -->
  <div class="sidebar__user" id="sidebar-user">
    <!-- Dynamic user info injected here -->
  </div>
</nav>

<!-- Mobile dark overlay behind open sidebar -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
